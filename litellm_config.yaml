  # Added 2026-11-04. Every entry is LOCAL: no API key, no quota, no bill.
  #
  # Why separate from ULTRA_FREE_CLOUD_TOOLS: that group has no local entries and
  # escalates to ULTRA_PAID_MODE_FAST on failure, so it can silently bill. This
  # group has NO fallback entry ON PURPOSE — if all three locals are down the
  # request fails loudly instead of quietly running on a paid cloud model.
  #
  # Tool-calling verified 2026-11-04 with a tools= payload (response carried
  # finish_reason: tool_calls and a populated tool_calls array):
  #   hosted_vllm Qwen2.5-14B-Instruct   PASS
  #   ollama_chat/qwen2.5:14b            PASS
  #   ollama_chat/qwen3:30b-a3b          PASS
  # Do NOT add cloud entries here on the strength of a "free" alias: a
  # gemini-3.1-flash-lite deployment inside ULTRA_FREE_CLOUD billed $3.5e-06 per
  # call, so alias naming is not evidence of zero cost. Verify with the
  # x-litellm-response-cost header instead.
  #
  # Note: qwen3 is a thinking model — its reasoning trace shares the token
  # budget. Measured 2026-11-04: max_tokens=300 returned empty content with
  # finish_reason=length; max_tokens=1024 and 2048 both returned proper
  # tool_calls (4/4). Give any qwen3 deployment >=1024 tokens.
  # ====================================================================
  - {model_name: ULTRA_FREE_TOOLS, litellm_params: {model: hosted_vllm/Qwen/Qwen2.5-14B-Instruct, api_key: local, api_base: http://localhost:8000/v1}}
